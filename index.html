<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kladi Exam Calendar — KLADI 학원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style id="css">:root{
 --bg:#F4F6F8;--surface:#FFFFFF;--surface2:#FAFBFC;--ink:#151A22;--ink2:#5B6472;--ink3:#8B94A3;
 --line:#DEE3EA;--line2:#EDF0F4;
 --mid:#96600A;--mid-bg:#FAF0DC;--m3:#A32552;--m3-bg:#FBE6ED;--fin:#2A4A9E;--fin-bg:#E7ECFA;
 --warn:#B4342A;--warn-bg:#FBE9E7;--ok:#0B6B62;--ok-bg:#E2F1EE;--hol:#B03A55;--hol-bg:#FBEDF0;
 --acc:#2A4A9E;--acc-soft:#EDF1FB;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0E1117;--surface:#161A21;--surface2:#1B2028;--ink:#E9EDF4;--ink2:#9BA5B4;--ink3:#6E7787;
 --line:#262C36;--line2:#1F242D;
 --mid:#E3B056;--mid-bg:#332812;--m3:#F2879F;--m3-bg:#3A1826;--fin:#8FADF2;--fin-bg:#18213B;
 --warn:#F2897E;--warn-bg:#3A1B17;--ok:#59C2B2;--ok-bg:#122B28;--hol:#EE8AA0;--hol-bg:#33161E;
 --acc:#8FADF2;--acc-soft:#171E2E;
}}
:root[data-theme="dark"]{
 --bg:#0E1117;--surface:#161A21;--surface2:#1B2028;--ink:#E9EDF4;--ink2:#9BA5B4;--ink3:#6E7787;
 --line:#262C36;--line2:#1F242D;
 --mid:#E3B056;--mid-bg:#332812;--m3:#F2879F;--m3-bg:#3A1826;--fin:#8FADF2;--fin-bg:#18213B;
 --warn:#F2897E;--warn-bg:#3A1B17;--ok:#59C2B2;--ok-bg:#122B28;--hol:#EE8AA0;--hol-bg:#33161E;
 --acc:#8FADF2;--acc-soft:#171E2E;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
.mono,.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding:26px 18px 90px;display:flex;flex-direction:column;gap:18px}
h1{font-family:"Gowun Batang",serif;font-size:27px;margin:0;font-weight:700;letter-spacing:-.01em;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1 .tagline{font-family:"IBM Plex Sans KR",sans-serif;font-size:13px;font-weight:400;color:var(--ink3);letter-spacing:0}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--ink3);font-weight:600}
select,input[type=text],input[type=date],textarea{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);
 border:1px solid var(--line);border-radius:4px;padding:6px 9px;min-width:0}
textarea{resize:vertical;min-height:52px;width:100%}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{appearance:none;font:inherit;font-size:13px;font-weight:600;border-radius:4px;padding:7px 14px;cursor:pointer;
 background:var(--ink);color:var(--surface);border:1px solid var(--ink)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.sm{padding:4px 9px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:16px 18px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(140px,1fr));min-width:1000px}
.scroller{overflow-x:auto;border:1px solid var(--line);border-radius:5px;background:var(--surface)}
.dow{padding:7px 9px;font-size:11px;font-weight:600;letter-spacing:.09em;color:var(--ink3);background:var(--surface2);border-bottom:1px solid var(--line)}
.dow.sat{color:var(--fin)}.dow.sun{color:var(--hol)}
.day{min-height:104px;padding:6px 7px 8px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);
 display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.day:nth-child(7n){border-right:0}
.day.out{background:var(--bg);opacity:.55}.day.we{background:var(--surface2)}.day.hol{background:var(--hol-bg)}
.dnum{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;gap:6px;align-items:center}
.day.hol .dnum{color:var(--hol)}
.holtag{font-size:10px;font-weight:600;color:var(--hol)}
.ch{display:block;border-radius:3px;padding:2px 5px;font-size:11px;line-height:1.35;border-left:3px solid;background:var(--surface2)}
.ch.중간{border-color:var(--mid);background:var(--mid-bg);color:var(--mid)}
.ch.기말{border-color:var(--fin);background:var(--fin-bg);color:var(--fin)}
.ch.m3{border-color:var(--m3);background:var(--m3-bg);color:var(--m3)}
.ch .g{opacity:.85;font-size:10px}
.mathbtn{appearance:none;border:1px solid var(--ok);background:var(--ok-bg);color:var(--ok);font:inherit;font-size:10.5px;
 font-weight:700;border-radius:3px;padding:2px 6px;cursor:pointer;text-align:left;width:100%}
.mathbtn:hover{filter:brightness(.96)}
.warnpin{color:var(--warn);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-size:11px;letter-spacing:.05em;color:var(--ink3);font-weight:600;background:var(--surface2);position:sticky;top:0}
tr.conf td{background:var(--warn-bg)}
.pill{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink2)}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.pill.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.pill.seed{color:var(--ink3)}
.stack{display:flex;flex-direction:column;gap:12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.dayrow{display:grid;grid-template-columns:112px repeat(3,1fr);gap:0;border-bottom:1px solid var(--line)}
.dayrow>div{padding:9px 10px;border-right:1px solid var(--line2)}
.dayrow>div:last-child{border-right:0}
.dayrow.head{background:var(--surface2);font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:.05em}
.dayrow .dl{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:12.5px}
.stu{display:inline-block;font-size:11.5px;padding:1px 6px;border-radius:3px;margin:0 3px 3px 0;background:var(--surface2);border:1px solid var(--line)}
.stu.ab{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.stu.mk{background:var(--m3-bg);border-color:var(--m3);color:var(--m3)}
.stu.rg{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.cnt{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:700;opacity:.75}
.dayck{display:flex;gap:3px}
.dayck label{font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink3);cursor:pointer}
.dayck input{margin:0}
.modal{position:fixed;inset:0;background:rgba(10,12,16,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.sheet{background:var(--surface);border-radius:6px;max-width:640px;width:100%;max-height:82vh;overflow:auto;padding:20px 22px;border:1px solid var(--line)}
.sheet h3{font-family:"Gowun Batang",serif;margin:0 0 4px;font-size:19px}
.muted{color:var(--ink3);font-size:12px}
.banner{border-radius:5px;padding:10px 14px;font-size:12.5px;border:1px solid}
.banner.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.banner.info{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.hr{height:1px;background:var(--line);margin:2px 0}
.small{font-size:11.5px;color:var(--ink3)}
@media(max-width:640px){.wrap{padding:16px 10px 70px}.dayrow{grid-template-columns:1fr}}

/* ---------- 진행률 / 출력 ---------- */
.big{font-family:"IBM Plex Mono",monospace;font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin:2px 0 6px}
.bar2{display:inline-block;width:110px;height:7px;border-radius:99px;background:var(--line);vertical-align:middle;overflow:hidden}
.bar2 i{display:block;height:100%;border-radius:99px}
.frow{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line2)}
.frow>span:first-child{width:88px;color:var(--ink2)}
.rephead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;
 padding:0 0 8px;border-bottom:2px solid var(--ink);margin-bottom:10px;font-size:13px}
table.rep{font-size:12px}
table.rep th{white-space:nowrap}
table.rep td{vertical-align:top}
td.st{font-weight:600;font-size:11.5px}
td.st.good{color:var(--ok)} td.st.bad{color:var(--warn)}
@media print{
 @page{size:A4 landscape;margin:9mm}
 body{background:#fff}
 body *{visibility:hidden}
 #printArea,#printArea *{visibility:visible}
 #printArea{position:absolute;left:0;top:0;width:100%}
 #printArea .scroller{border:0;overflow:visible}
 table.rep{font-size:8pt}
 table.rep th{background:#F0F2F5!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 table.rep th,table.rep td{padding:3px 5px;border-bottom:1px solid #CCD2DA}
 tr{break-inside:avoid}
 .noprint{display:none}
}

/* ---------- 미실시 ---------- */
.pill.skip{color:var(--ink3);border-color:var(--ink3);background:var(--surface2)}
.card.skipped{opacity:.72;border-style:dashed}
.card.skipped .hr ~ .bar,.card.skipped textarea,.card.skipped .hr ~ div{filter:grayscale(1)}
.skiprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 2px;
 padding:8px 10px;border-radius:4px;background:var(--surface2);border:1px dashed var(--line)}
.skipck{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.skipck input{margin:0;width:15px;height:15px}
.skiprow input[type=text]{flex:1;min-width:170px;font-size:12px;padding:4px 8px}
td.st.skip{color:var(--ink3)}

/* ---------- 캘린더 범례 ---------- */
.legend{display:flex;flex-wrap:wrap;gap:7px 16px;align-items:center;font-size:12px;color:var(--ink2);
 padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:5px}
.legend .lg{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend .sub2{font-weight:400;color:var(--ink3);font-size:11px}
.legend .sw{width:15px;height:11px;border-radius:2px;flex:none;border-left:3px solid}
.legend .sw.중간{background:var(--mid-bg);border-color:var(--mid)}
.legend .sw.기말{background:var(--fin-bg);border-color:var(--fin)}
.legend .sw.m3{background:var(--m3-bg);border-color:var(--m3)}
.legend .sw.math{background:var(--ok-bg);border:1px solid var(--ok)}
.legend .sw.mk{background:var(--m3);border:0;width:9px;height:9px;border-radius:50%}
.legend .sw.holi{background:var(--hol-bg);border:1px solid var(--hol)}


/* ================= 앱바 · 탭 (2차 디자인) ================= */
.wrap{gap:0}
.appbar{display:flex;align-items:center;gap:20px;flex-wrap:wrap;
 padding:14px 18px;background:var(--surface);border:1px solid var(--line);
 border-radius:8px 8px 0 0;border-bottom:0}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto}
.mark{width:34px;height:34px;flex:none;border-radius:8px;display:grid;place-items:center;
 background:linear-gradient(150deg,var(--ink) 0%,var(--acc) 130%);color:var(--surface);
 font-family:"Gowun Batang",serif;font-weight:700;font-size:19px;line-height:1;letter-spacing:.02em;
 box-shadow:0 1px 2px rgba(0,0,0,.18)}
.bname{display:flex;flex-direction:column;gap:1px;line-height:1.25}
.bname b{font-family:"Gowun Batang",serif;font-size:19px;font-weight:700;letter-spacing:-.01em}
.bname span{font-size:10.5px;letter-spacing:.12em;color:var(--ink3);font-weight:600}
.meters{display:flex;gap:0;align-items:stretch}
.meter{display:flex;flex-direction:column;align-items:flex-end;gap:1px;padding:0 15px;
 border-right:1px solid var(--line2)}
.meter:last-child{border-right:0;padding-right:0}
.meter b{font-family:"IBM Plex Mono",monospace;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.meter b.bad{color:var(--warn)} .meter b.todo{color:var(--mid)}
.meter span{font-size:10px;color:var(--ink3);letter-spacing:.02em;white-space:nowrap}
.savebox{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink3)}
.stamp{font-size:11px;color:var(--ink3)}
.tabwrap{background:var(--surface);border:1px solid var(--line);border-radius:0 0 8px 8px;
 border-top:1px solid var(--line2);padding:0 8px;overflow-x:auto;margin-bottom:18px;
 box-shadow:0 1px 2px rgba(16,20,28,.04)}
.tabs{display:flex;gap:1px;min-width:max-content}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;
 padding:11px 14px 9px;font:inherit;font-size:13.5px;font-weight:500;color:var(--ink2);
 cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;
 transition:color .12s,border-color .12s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
.tc{display:inline-block;border-radius:999px;font-size:10px;font-weight:700;padding:1px 6px;
 font-family:"IBM Plex Mono",monospace;background:var(--line);color:var(--ink2)}
.tc.bad{background:var(--warn);color:#fff}
.tc.todo{background:var(--mid-bg);color:var(--mid);border:1px solid var(--mid-br)}
.stack{gap:14px}

/* ================= 달 요약 스트립 ================= */
.monthbar{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;padding:2px 2px 2px}
.mnum{font-family:"Gowun Batang",serif;font-size:23px;font-weight:700;letter-spacing:-.01em;line-height:1}
.mnum em{font-style:normal;font-size:13px;margin-left:2px;color:var(--ink3)}
.mstat{font-size:12px;color:var(--ink3)}
.mstat b{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:600;color:var(--ink);
 font-variant-numeric:tabular-nums;margin-right:2px}
.mstat.sub2{margin-left:auto;font-size:11.5px}

/* ================= 달력 마감 ================= */
.day{transition:background .12s}
.day.today{background:var(--acc-soft);box-shadow:inset 0 0 0 1.5px var(--acc)}
.tdot{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;
 border-radius:999px;background:var(--acc);color:#fff;font-size:11.5px;font-weight:700}
.ch{transition:transform .1s,filter .1s;cursor:pointer}
.ch:hover{filter:brightness(.97);transform:translateX(1px)}
.mathbtn{transition:filter .1s}
.scroller{box-shadow:0 1px 2px rgba(16,20,28,.04)}
.card{box-shadow:0 1px 2px rgba(16,20,28,.04)}

/* ================= 표 마감 ================= */
tbody tr:nth-child(even) td,table tr:nth-child(even) td{background:var(--surface2)}
tr.conf td{background:var(--warn-bg)!important}
table tr:hover td{background:var(--acc-soft)}
th{position:sticky;top:0;z-index:2;box-shadow:inset 0 -1px 0 var(--line)}

/* ================= D-day 패널 ================= */
.ddbtn{letter-spacing:.03em}
.ddwrap{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;
 box-shadow:0 1px 2px rgba(16,20,28,.04)}
.ddhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:9px;margin-bottom:10px;
 border-bottom:1px solid var(--line2)}
.ddhead b{font-size:14px}
.ddhead .sub2{font-size:11.5px;color:var(--ink3)}
.ddfilter{display:flex;gap:4px;margin-left:auto}
.ddgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:8px}
.ddcard{appearance:none;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:3px;
 padding:9px 11px;border-radius:5px;border:1px solid var(--line);border-left:3px solid var(--line);
 background:var(--surface2);color:var(--ink);transition:transform .1s,box-shadow .1s}
.ddcard:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(16,20,28,.09)}
.ddcard.중간{border-left-color:var(--mid)}
.ddcard.기말{border-left-color:var(--fin)}
.ddcard.m3{border-left-color:var(--m3)}
.ddtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ddn{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:700;color:var(--ink3)}
.ddsch{font-size:13px;font-weight:600;line-height:1.3}
.ddsch em{font-style:normal;font-weight:400;font-size:11px;color:var(--ink3)}
.ddate{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
.ddsub{font-size:11px;color:var(--ink3)}
.ddsub i{font-style:normal;color:var(--warn)}
.ddsub b{color:var(--m3);font-weight:600}
.dd{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:700;
 letter-spacing:-.01em;padding:1px 8px;border-radius:999px;background:var(--line);color:var(--ink2)}
.dd.mid{background:var(--mid-bg);color:var(--mid)}
.dd.near{background:var(--warn-bg);color:var(--warn)}
.dd.today{background:var(--warn);color:#fff}
.dd.now{background:var(--m3-bg);color:var(--m3)}
.dd.now em{font-style:normal;font-size:10.5px;opacity:.75;margin-left:2px}
.dd.done{background:transparent;border:1px solid var(--line);color:var(--ink3);font-weight:500}
.sheet h3 .dd{vertical-align:2px;margin-left:6px}

.fbbanner{font-family:"IBM Plex Sans KR",sans-serif;font-size:13px;padding:11px 18px;background:#FBE9E7;color:#B4342A;border-bottom:1px solid #B4342A}
.fbbanner.info{background:#E2F1EE;color:#0B6B62;border-color:#0B6B62}
.fbbanner code{font-family:"IBM Plex Mono",monospace;background:rgba(0,0,0,.06);padding:1px 5px;border-radius:3px}
</style>
</head>

  const R     = (p)=>ref(db, ROOM+(p?'/'+p:''));

  const asMap = (arr,k)=>{const o={};(arr||[]).forEach(x=>o[x[k]]=x);return o};

          schools:  v.schools||seed.schools,

      }

        const u={['students/'+patch.s.id]: patch.s, ...stamp};
        if(patch.schools) u.schools = patch.schools;
        await update(R(), u);
      }
      else await update(R(), stamp);
    }
  };
  window.KLADI_ATTACH(store);

function ddayList(){

 return targets().filter(function(e){return e.start&&e.end}).map(function(e){
   var d=dayDiff(today,e.start), de=dayDiff(today,e.end);
   var st = (d>0)?'soon' : (de>=0?'now':'done');
   var md = e.mathDate? dayDiff(today,e.mathDate) : null;
   var mk = makeupOf(e), mkd = mk? dayDiff(today,mk) : null;
   return {e:e,d:d,de:de,st:st,md:md,mkd:mkd,n:stuOf(e.school,e.grade).length};
 }).sort(function(a,b){
   var r={now:0,soon:1,done:2};
   if(r[a.st]!==r[b.st])return r[a.st]-r[b.st];
   return (a.st==='done')? b.d-a.d : a.d-b.d;
 });
}

var FIELDS=[['start','시험기간'],['mathDate','수학시험일'],['scope','시험범위'],['print','프린트'],['notice','학교안내']];
function targets(){return allEff().filter(function(e){return stuOf(e.school,e.grade).length>0&&!isSkipped(e)})}
function fillOf(e){var n=0;FIELDS.forEach(function(f){
  var v=(f[0]==='start')?(e.start&&e.end):e[f[0]];if(v)n++});return n}
function missingOf(e){var m=[];FIELDS.forEach(function(f){
  var v=(f[0]==='start')?(e.start&&e.end):e[f[0]];if(!v)m.push(f[1])});return m}
function noSchedule(){

  S.students.forEach(function(s){if(s.active)pairs[s.school+'|'+s.grade]=(pairs[s.school+'|'+s.grade]||0)+1});

function planFor(fromISO,toISO,teacher){
 var effs=allEff().filter(function(e){return e.start&&e.end&&!isSkipped(e)});
 var byKey={};effs.forEach(function(e){byKey[e.school+'|'+e.grade]=byKey[e.school+'|'+e.grade]||[];byKey[e.school+'|'+e.grade].push(e)});
 var out=[],d=D(fromISO),end=D(toISO),guard=0;
 var pool=S.students.filter(function(s){return s.active&&(teacher==='전체'||s.teacher===teacher)});
 while(d<=end&&guard++<200){
   var day={date:iso(d),dow:d.getDay(),ab:[],rg:[],mk:[],hol:S.holidays[iso(d)]||''};
   pool.forEach(function(s){
     var list=byKey[s.school+'|'+s.grade]||[];
     var isClass=s.days.indexOf(d.getDay())>=0;
     var state=null,note='';
     for(var i=0;i<list.length;i++){
       var e=list[i],mk=makeupOf(e);
       if(mk&&mk===iso(d)){state='mk';note=e.term+' 수학 '+md(e.mathDate);break}
     }
     if(!state&&isClass){
       for(var j=0;j<list.length;j++){
         var e2=list[j];
         if(iso(d)>=e2.start&&iso(d)<=e2.end){
           state=(iso(d)===e2.end)?'rg':'ab';
           note=e2.term+' '+md(e2.start)+'~'+md(e2.end)+(iso(d)===e2.end?' 종료일':'');
           break;
         }
       }
       if(!state){state='rg';note='정규'}
     }
     if(state==='mk')day.mk.push({s:s,note:note});
     else if(state==='ab')day.ab.push({s:s,note:note});
     else if(state==='rg')day.rg.push({s:s,note:note});
   });
   out.push(day);d=add(d,1);
 }
 return out;
}

     return}
   sks.forEach(function(tm){rows2.push([s.name,s.school,s.grade,s.teacher,dstr,tm+'고사','미실시','','',
     (S.skips[s.school+'|'+s.grade+'|'+tm].reason||'수행평가 대체')])});
   ks.sort(function(a,b){return (a.start||'9').localeCompare(b.start||'9')}).forEach(function(e,i){
     var j=i+sks.length;
     rows2.push([j?'':s.name,j?'':s.school,j?'':s.grade,j?'':s.teacher,j?'':dstr,e.term+'고사',
       (e.start?md(e.start)+' ~ '+md(e.end):''),md(e.mathDate),md(makeupOf(e)),e.scope]);
   });
 });
 return {head:head2,rows:rows2,title:'학생별 시험 일정'};
}

function repView(){
 var r=repRows();
 var scopes=(ui.repMode==='school')?['전체'].concat(S.schools.filter(function(x){
     return S.students.some(function(s){return s.active&&s.school===x})})) : ['전체'].concat(S.teachers);
 if(scopes.indexOf(ui.repScope)<0)ui.repScope='전체';
 var h='<div class="bar noprint">'
  +'<label class="f">출력 종류<select data-act="repMode">'
   +[['school','학교별 시험 정보'],['student','학생별 시험 일정']].map(function(m){
     return '<option value="'+m[0]+'"'+(ui.repMode===m[0]?' selected':'')+'>'+m[1]+'</option>'}).join('')+'</select></label>'
  +'<label class="f">'+(ui.repMode==='school'?'학교':'담당 선생님')+'<select data-act="repScope">'
   +scopes.map(function(x){return '<option'+(x===ui.repScope?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select></label>'
  +'<button class="btn" data-act="print">인쇄 / PDF 저장</button>'
  +'<button class="btn sec" data-act="csv">CSV 저장</button>'
  +'<span class="small">'+r.rows.length+'행</span></div>';
 h+='<div id="printArea"><div class="rephead"><div><b>KLADI 학원 · Kladi Exam Calendar</b> — '+esc(r.title)
  +' <span class="muted">('+esc(ui.repScope)+')</span></div>'
  +'<div class="muted">2026학년도 2학기 · 출력 '+new Date().toISOString().slice(0,10)+(S.updated?' · 최종 저장 '+esc(S.updated):'')+'</div></div>'
  +'<div class="scroller"><table class="rep"><tr>'+r.head.map(function(x){return '<th>'+esc(x)+'</th>'}).join('')+'</tr>'
  +r.rows.map(function(row){return '<tr>'+row.map(function(c,i){
     var cls=(typeof c==='number'||/^\d/.test(String(c)))?' class="num"':'';
     if(r.head[i]==='상태')cls=' class="st '+(c==='충돌'?'bad':c==='미실시'?'skip':(c==='완료'||c==='확정'?'good':''))+'"';
     return '<td'+cls+'>'+esc(c)+'</td>'}).join('')+'</tr>'}).join('')
  +'</table></div></div>';
 return h;
}

function modalHTML(){
 if(!ui.modal)return '';
 var m=ui.modal,h='';
 if(m.type==='math'||m.type==='detail'){
   var g=groups()[m.key];if(!g)return '';
   var e=eff(g),list=stuOf(e.school,e.grade);
   var byT={};list.forEach(function(s){(byT[s.teacher]=byT[s.teacher]||[]).push(s)});
   var dx=(function(){var t=iso(new Date());var d=dayDiff(t,e.start),de=dayDiff(t,e.end);
     return {d:d,de:de,st:(d>0)?'soon':(de>=0?'now':'done')}})();
   h='<h3>'+esc(e.school)+' '+esc(e.grade)+' '+esc(e.term)+'고사 '+ddayTag(dx)+'</h3>'
    +'<div class="muted">시험기간 '+esc(md(e.start))+' ~ '+esc(md(e.end))+' · 수학 '+esc(md(e.mathDate)||'미입력')
    +' · 직전보강 '+esc(md(makeupOf(e))||'—')+' · 프린트 '+esc(e.print||'미확인')+'</div>'
    +(e.conflict?'<div class="banner warn" style="margin-top:8px">서로 다른 정보가 입력되어 있습니다. 정보 충돌 탭에서 확정해 주세요.</div>':'')
    +(e.scope?'<div style="margin-top:10px"><b class="small">시험 범위</b><div style="font-size:13px">'+esc(e.scope)+'</div></div>':'')
    +(e.notice?'<div style="margin-top:8px"><b class="small">학교 안내</b><div style="font-size:13px">'+esc(e.notice)+'</div></div>':'')
    +'<div class="hr" style="margin:12px 0"></div><b class="small">담당 선생님별 학생 '+list.length+'명</b>'
    +Object.keys(byT).sort().map(function(t){
      return '<div style="margin-top:8px"><b style="font-size:13px">'+esc(t)+'</b> <span class="cnt">'+byT[t].length+'명</span><div>'
       +byT[t].map(function(s){return '<span class="stu">'+esc(s.name)+(s.days.length?'':' <span style="color:var(--warn)">요일미입력</span>')+'</span>'}).join('')+'</div></div>'}).join('');
 }
 return '<div class="modal" data-act="closeModal"><div class="sheet" data-stop="1">'+h
  +'<div style="margin-top:14px"><button class="btn sec" data-act="closeModal">닫기</button></div></div></div>';
}

function render(){
 var body='';
 if(ui.tab==='cal')body=calView();
 else if(ui.tab==='input')body=inputView();
 else if(ui.tab==='conf')body=confView();
 else if(ui.tab==='stu')body=stuView();
 else if(ui.tab==='prog')body=progView();
 else if(ui.tab==='rep')body=repView();
 else body=opsView();
 root.innerHTML='<div class="wrap">'+head()+'<div class="stack">'+body+'</div>'
  +'<div class="small">Kladi Exam Calendar · 초기 시험일정은 NEIS 학사일정 기준이며 담당 학생 확인 후 갱신하세요. · 저장 위치: '
  +(STORE?'Firebase (선생님 전원 실시간 공유)':(cap?'공유 문서 (같은 링크를 보는 화면 자동 갱신)':'이 브라우저에만 저장 — 공유되지 않습니다'))
  +'</div></div>'
  +modalHTML();
}

/* ---------- 이벤트 ---------- */
function fieldVals(key){
 var o={};document.querySelectorAll('[data-k="'+key+'"][data-fld]').forEach(function(el){o[el.dataset.fld]=el.value});
 return o;
}
document.addEventListener('click',function(ev){
 var t=ev.target.closest('[data-act]');
 if(!t){return}
 var a=t.dataset.act;
 if(a==='closeModal'){var inSheet=ev.target.closest('[data-stop]'),isBtn=ev.target.closest('button[data-act="closeModal"]');
   if(!inSheet||isBtn){ui.modal=null;render()} return}
 if(a==='tab'){ui.tab=t.dataset.v;msg='';render();return}
 if(a==='month'){ui.month=+t.dataset.v;render();return}
 if(a==='dday'){ui.dday=!ui.dday;render();return}
 if(a==='ddf'){ui.ddayFilter=t.dataset.v;ui.ddayAll=false;render();return}
 if(a==='ddmore'){ui.ddayAll=!ui.ddayAll;render();return}
 if(a==='print'){window.print();return}
 if(a==='csv'){var r=repRows();
   dl('kladi-'+(ui.repMode==='school'?'시험정보':'학생일정')+'-'+ui.repScope+'.csv',csv([r.head].concat(r.rows)));return}
 if(a==='math'||a==='detail'){ui.modal={type:a,key:t.dataset.k};render();return}
 if(a==='submit'){
   var k=t.dataset.k,v=fieldVals(k),p=k.split('|');
   if(!v.start||!v.end){msg='시험 시작일과 종료일을 입력해 주세요.';render();return}
   S.entries.push({id:uid('e'),school:p[0],grade:p[1],term:p[2],start:v.start,end:v.end,mathDate:v.mathDate||'',
     scope:v.scope||'',print:(v.print==='미확인'?'':v.print||''),notice:v.notice||'',by:v.by||S.teachers[0],
     ts:new Date().toISOString().slice(0,10),seed:false,confirmed:false});
   save({t:'entry',e:S.entries[S.entries.length-1]});return;
 }
 if(a==='mk'){
   var k2=t.dataset.k,el=document.querySelector('[data-k="'+k2+'"][data-fld="mk"]');
   if(el&&el.value)S.overrides[k2]=el.value;else delete S.overrides[k2];
   save({t:'ov',key:k2,v:(el&&el.value)||null});return;
 }
 if(a==='confirm'){
   var id=t.dataset.id,tgt=S.entries.filter(function(e){return e.id===id})[0];if(!tgt)return;
   var ids={};S.entries.forEach(function(e){if(keyOf(e)===keyOf(tgt)){e.confirmed=(e.id===id);ids[e.id]=e.confirmed}});
   save({t:'confirm',ids:ids});return;
 }
 if(a==='delentry'){var did=t.dataset.id;S.entries=S.entries.filter(function(e){return e.id!==did});save({t:'delEntry',id:did});return}
 if(a==='delstu'){
   var s=S.students.filter(function(x){return x.id===t.dataset.id})[0];
   if(s&&confirm(s.name+' 학생을 명단에서 제거할까요?')){s.active=false;save({t:'stu',s:s})}
   return;
 }
 if(a==='addstu'){
   var nm=$('na').value.trim(),sc2=$('nsc').value.trim();
   if(!nm||!sc2){msg='이름과 학교를 입력해 주세요.';render();return}
   var ds=[];document.querySelectorAll('.ndc:checked').forEach(function(c){ds.push(+c.value)});
   S.students.push({id:uid('s'),name:nm,school:sc2,grade:$('ng').value,teacher:$('nt').value,days:ds,active:true});
   if(S.schools.indexOf(sc2)<0){S.schools.push(sc2);S.schools.sort()}
   save({t:'stu',s:S.students[S.students.length-1],schools:S.schools});return;
 }
});
document.addEventListener('change',function(ev){
 var t=ev.target.closest('[data-act]');if(!t)return;
 var a=t.dataset.act;
 if(a==='school'){ui.school=t.value;render()}
 else if(a==='repMode'){ui.repMode=t.value;ui.repScope='전체';render()}
 else if(a==='repScope'){ui.repScope=t.value;render()}
 else if(a==='teacher'){ui.teacher=t.value;render()}
 else if(a==='from'){ui.from=t.value;render()}
 else if(a==='to'){ui.to=t.value;render()}
 else if(a==='stuFilter'){ui.stuFilter=t.value;render()}
 else if(a==='skip'){
   var kk=t.dataset.k,rin=document.querySelector('[data-k="'+kk+'"][data-fld="skipReason"]');
   var byS=document.querySelector('[data-k="'+kk+'"][data-fld="by"]');
   if(t.checked)S.skips[kk]={reason:(rin&&rin.value.trim())||'수행평가 대체',by:(byS&&byS.value)||'',ts:new Date().toISOString().slice(0,10)};
   else delete S.skips[kk];
   save({t:'skip',key:kk,v:S.skips[kk]||null});
 }
 else if(a==='days'){
   var s=S.students.filter(function(x){return x.id===t.dataset.id})[0];if(!s)return;
   var d=+t.dataset.v,i=s.days.indexOf(d);
   if(t.checked&&i<0)s.days.push(d);else if(!t.checked&&i>=0)s.days.splice(i,1);
   s.days.sort();save({t:'stu',s:s});
 }
});
document.addEventListener('input',function(ev){
 var t=ev.target.closest('[data-act="stuQ"]');if(!t)return;
 ui.stuQ=t.value;var pos=t.selectionStart;render();
 var n=document.querySelector('[data-act="stuQ"]');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}
});

window.KLADI_ATTACH=function(store){
 STORE=store;ro=false;msg='연결 중…';render();
 Promise.resolve(store.init&&store.init()).then(function(){msg='';render()})
 .catch(function(e){msg='연결 실패: '+(e&&e.message||e);render()});
};
function restoreLocal(){
 try{var raw=localStorage.getItem(LKEY);if(!raw)return false;
  var v=JSON.parse(raw);if(!v||!v.students)return false;
  S.students=(v.students||[]).map(normStu);S.entries=(v.entries||S.entries).map(normEnt);S.overrides=v.overrides||{};S.skips=v.skips||{};
  if(v.schools)S.schools=v.schools;S.updated=v.updated||'';return true;
 }catch(e){return false}
}
render();
if(window.claude&&window.claude.use){
 window.claude.use('artifact').then(function(a){
   cap=a;
   if(!a){LOCAL=true;restoreLocal()}
   render();
 }).catch(function(){LOCAL=true;restoreLocal();render()});
 window.claude.use('downloads').then(function(d){DL=d}).catch(function(){});
}else{
 LOCAL=true;restoreLocal();render();
}
})();
</script>
